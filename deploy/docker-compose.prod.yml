# Production on a single Linux server: PostgreSQL + web/API + worker + Caddy (HTTPS).
# Run from the repository root:
#   docker compose -f deploy/docker-compose.prod.yml --env-file .env up -d --build
# Needs in .env: DOMAIN, POSTGRES_PASSWORD, APP_ENCRYPTION_KEY, PUBLIC_BASE_URL=https://<DOMAIN>, SECURE_COOKIES=true
name: supportx
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: supportx
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: supportx
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U supportx"]
      interval: 5s
      retries: 10

  server:
    build: ..
    restart: unless-stopped
    env_file: ../.env
    environment:
      DATABASE_URL: postgres://supportx:${POSTGRES_PASSWORD}@db:5432/supportx
      HOST: 0.0.0.0
      PORT: "3000"
    volumes:
      # Customer look: theme.json + logo/fonts. Active when .env sets THEME_DIR=/app/theme (docs/THEMING.de.md).
      - ../theme:/app/theme:ro
    depends_on:
      db:
        condition: service_healthy

  worker:
    build: ..
    restart: unless-stopped
    command: ["node", "--import", "tsx", "apps/worker/main.ts"]
    env_file: ../.env
    environment:
      DATABASE_URL: postgres://supportx:${POSTGRES_PASSWORD}@db:5432/supportx
    depends_on:
      db:
        condition: service_healthy

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN:?set DOMAIN}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - server

volumes:
  db-data:
  caddy-data:
  caddy-config:
